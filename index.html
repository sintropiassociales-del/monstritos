<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plataforma Monstritos</title>
<link rel="icon" href="icono.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="puntuacion.js"></script>
<style>
  :root {
    --verde: #71CB47; --verde-osc: #3F8F1F; --verde-claro: #EAF7E2;
    --azul: #4FAFEA; --azul-osc: #1C6FA8; --azul-claro: #E5F3FC;
    --rosa: #DB5183; --rosa-osc: #A8315D; --rosa-claro: #FBE7EF;
    --ambar: #E9A21B; --ambar-osc: #8A5A00; --ambar-claro: #FDF1D8;
    --tinta: #141718; --tinta-2: #4A5053; --tinta-3: #7A8285;
    --bg: #F5F8F3; --card: #FFFFFF; --borde: #E1E8DD; --borde-2: #CFD9CA;
    --radio: 14px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font-family: "Nunito", system-ui, -apple-system, "Segoe UI", Arial, sans-serif; background: var(--bg); color: var(--tinta); font-size: 15px; line-height: 1.45; }
  h1, h2, h3, .fredoka, button, .tabs, .chip, .kpi .num { font-family: "Fredoka", "Nunito", system-ui, sans-serif; }
  h1 { font-size: 26px; margin: 0 0 4px; font-weight: 700; letter-spacing: -0.2px; }
  h2 { font-size: 19px; margin: 0 0 12px; font-weight: 600; }
  h3 { font-size: 16px; margin: 20px 0 8px; font-weight: 600; }
  a { color: var(--azul-osc); }
  .subtle { color: var(--tinta-2); font-size: 14px; margin: 0 0 12px; max-width: 72ch; }
  .muted { color: var(--tinta-3); font-size: 13px; }

  /* ---------- barra superior ---------- */
  header.topbar { background: #fff; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 20px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--tinta); }
  .brand img { height: 46px; width: auto; display: block; }
  .brand .tag { font-family: "Fredoka"; font-weight: 600; font-size: 13px; color: var(--tinta-2); border-left: 2px solid var(--borde); padding-left: 12px; line-height: 1.15; }
  .userbox { display: flex; align-items: center; gap: 10px; font-size: 14px; flex-wrap: wrap; }
  .stripe { height: 6px; display: flex; }
  .stripe span { flex: 1; } .stripe span:nth-child(1) { background: var(--verde); } .stripe span:nth-child(2) { background: var(--azul); } .stripe span:nth-child(3) { background: var(--rosa); }
  nav.tabs { display: flex; gap: 2px; background: #fff; padding: 0 14px; border-bottom: 1px solid var(--borde); overflow-x: auto; }
  nav.tabs button { background: none; border: none; padding: 13px 14px 11px; cursor: pointer; font-size: 15px; color: var(--tinta-2); border-bottom: 4px solid transparent; font-weight: 600; white-space: nowrap; border-radius: 0; }
  nav.tabs button:hover { color: var(--tinta); }
  nav.tabs button.active { color: var(--tinta); border-bottom-color: var(--verde); }
  nav.tabs button .count { background: var(--rosa); color: #fff; border-radius: 20px; font-size: 11px; padding: 1px 7px; margin-left: 6px; }
  main { max-width: 1120px; margin: 0 auto; padding: 22px 16px 70px; }

  .card { background: var(--card); border: 1px solid var(--borde); border-radius: var(--radio); padding: 20px; margin-bottom: 18px; }
  .card.pad-s { padding: 14px 16px; }

  /* ---------- formularios ---------- */
  label { display: block; font-size: 13px; font-weight: 700; margin: 12px 0 5px; color: var(--tinta); }
  input[type=text], input[type=email], input[type=password], input[type=date], input[type=number], input[type=search], select, textarea {
    width: 100%; padding: 10px 12px; border: 1.5px solid var(--borde-2); border-radius: 10px; font-size: 15px; font-family: inherit; background: #fff; color: var(--tinta);
  }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--azul); box-shadow: 0 0 0 3px var(--azul-claro); }
  textarea { min-height: 70px; resize: vertical; }
  .row { display: flex; gap: 14px; flex-wrap: wrap; }
  .row > div { flex: 1; min-width: 160px; }

  /* ---------- botones ---------- */
  button { cursor: pointer; font-size: 14px; font-weight: 600; border-radius: 11px; border: none; transition: background .15s, transform .05s; }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .btn { padding: 10px 16px; display: inline-flex; align-items: center; gap: 6px; }
  .btn.primary { background: var(--tinta); color: #fff; }
  .btn.primary:hover { background: #2c3235; }
  .btn.verde { background: var(--verde); color: var(--tinta); }
  .btn.verde:hover { background: #63B93C; }
  .btn.sec { background: #fff; color: var(--tinta); border: 1.5px solid var(--borde-2); }
  .btn.sec:hover { border-color: var(--tinta-3); }
  .btn.peligro { background: #fff; color: var(--rosa-osc); border: 1.5px solid #F0BCD0; }
  .btn.s { padding: 6px 11px; font-size: 13px; border-radius: 9px; }
  .btn.link { background: none; color: var(--azul-osc); padding: 4px 6px; }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
  .toolbar.between { justify-content: space-between; }
  .toolbar .grow { flex: 1; }

  /* ---------- tablas ---------- */
  .tabla-wrap { overflow-x: auto; margin-top: 8px; border: 1px solid var(--borde); border-radius: 12px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; background: #fff; }
  th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--borde); vertical-align: middle; }
  th { color: var(--tinta-2); font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: .4px; background: #FAFCF9; white-space: nowrap; }
  tr:last-child td { border-bottom: none; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.acc { white-space: nowrap; text-align: right; }

  /* ---------- chips ---------- */
  .chip { display: inline-block; padding: 2px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .chip.bajo, .chip.normal, .chip.ok { background: var(--verde-claro); color: var(--verde-osc); }
  .chip.medio, .chip.limite, .chip.warn { background: var(--ambar-claro); color: var(--ambar-osc); }
  .chip.alto, .chip.anormal, .chip.err { background: var(--rosa-claro); color: var(--rosa-osc); }
  .chip.info { background: var(--azul-claro); color: var(--azul-osc); }
  .chip.gris { background: #EEF1ED; color: var(--tinta-2); }
  .chip.admin { background: var(--rosa-claro); color: var(--rosa-osc); }
  .chip.operativo { background: var(--azul-claro); color: var(--azul-osc); }

  .msg { padding: 11px 14px; border-radius: 10px; font-size: 14px; margin-top: 12px; }
  .msg.error { background: var(--rosa-claro); color: var(--rosa-osc); }
  .msg.ok { background: var(--verde-claro); color: var(--verde-osc); }
  .msg.info { background: var(--azul-claro); color: var(--azul-osc); }
  .msg.warn { background: var(--ambar-claro); color: var(--ambar-osc); }
  .msg ul { margin: 6px 0 0; padding-left: 20px; }
  .hidden { display: none !important; }

  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid currentColor; border-top-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; vertical-align: -2px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .cargando { padding: 40px; text-align: center; color: var(--tinta-2); }

  /* ---------- login ---------- */
  .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; background:
    radial-gradient(circle at 12% 18%, var(--verde-claro) 0 120px, transparent 121px),
    radial-gradient(circle at 88% 80%, var(--rosa-claro) 0 150px, transparent 151px),
    radial-gradient(circle at 85% 12%, var(--azul-claro) 0 90px, transparent 91px), var(--bg); }
  .login-card { max-width: 400px; width: 100%; background: #fff; border-radius: 22px; padding: 28px 26px; border: 1px solid var(--borde); }
  .login-card img { width: 220px; display: block; margin: 0 auto 6px; }
  .login-card .sub { text-align: center; color: var(--tinta-2); margin: 0 0 8px; }

  /* ---------- modal ---------- */
  .modal-bg { position: fixed; inset: 0; background: rgba(20,23,24,.45); display: flex; align-items: flex-start; justify-content: center; padding: 28px 12px; overflow-y: auto; z-index: 50; }
  .modal { background: #fff; border-radius: 18px; padding: 22px; max-width: 580px; width: 100%; }
  .modal.wide { max-width: 980px; }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; flex-wrap: wrap; position: sticky; bottom: -22px; background: #fff; padding: 12px 0; border-top: 1px solid var(--borde); }

  /* ---------- proyecto ---------- */
  .breadcrumb { font-size: 14px; color: var(--tinta-2); margin-bottom: 10px; }
  .breadcrumb button { background: none; padding: 0; color: var(--azul-osc); font-family: inherit; font-weight: 700; }
  .proy-head { display: flex; justify-content: space-between; gap: 14px; flex-wrap: wrap; align-items: flex-start; }
  .proy-meta { display: flex; gap: 14px; flex-wrap: wrap; font-size: 14px; color: var(--tinta-2); margin-top: 4px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-top: 16px; }
  .kpi { border-radius: 12px; padding: 12px 14px; background: #FAFCF9; border: 1px solid var(--borde); }
  .kpi .num { font-size: 26px; font-weight: 700; line-height: 1.1; }
  .kpi .lbl { font-size: 13px; color: var(--tinta-2); }
  .kpi.v { border-top: 4px solid var(--verde); } .kpi.a { border-top: 4px solid var(--azul); } .kpi.r { border-top: 4px solid var(--rosa); } .kpi.n { border-top: 4px solid var(--tinta); }
  .subtabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 4px 0 16px; }
  .subtabs button { background: #fff; border: 1.5px solid var(--borde-2); padding: 8px 14px; color: var(--tinta-2); border-radius: 30px; }
  .subtabs button.active { background: var(--tinta); color: #fff; border-color: var(--tinta); }
  .subtabs button .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }

  /* ---------- captura de cuestionarios ---------- */
  .q-grid { width: 100%; border-collapse: collapse; margin-top: 8px; }
  .q-grid th { position: sticky; top: -22px; background: #fff; z-index: 2; font-size: 11px; text-align: center; }
  .q-grid th:first-child { text-align: left; }
  .q-grid td { padding: 7px 8px; border-bottom: 1px solid var(--borde); font-size: 14px; }
  .q-grid td.opt { text-align: center; width: 88px; }
  .q-grid tr.falta td:first-child { box-shadow: inset 4px 0 0 var(--rosa); }
  .q-grid input[type=radio] { width: 20px; height: 20px; accent-color: var(--tinta); cursor: pointer; }
  .q-grid .inv { font-size: 11px; color: var(--tinta-3); }
  .preg { border: 1px solid var(--borde); border-radius: 12px; padding: 12px 14px; margin-top: 10px; }
  .preg.falta { border-color: #F0BCD0; background: #FFF9FB; }
  .preg.alerta-on { border-color: var(--rosa); box-shadow: 0 0 0 2px var(--rosa-claro); }
  .preg .enun { font-weight: 700; margin-bottom: 8px; }
  .preg .ops { display: flex; flex-wrap: wrap; gap: 6px; }
  .preg .ops label { margin: 0; font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; border: 1.5px solid var(--borde-2); padding: 6px 11px; border-radius: 20px; cursor: pointer; background: #fff; }
  .preg .ops label:has(input:checked) { background: var(--tinta); color: #fff; border-color: var(--tinta); }
  .preg .ops input { accent-color: var(--verde); margin: 0; }
  .preg .extra { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
  .preg .extra > div { flex: 1; min-width: 180px; }
  .seccion-nota { background: var(--azul-claro); color: var(--azul-osc); border-radius: 10px; padding: 8px 12px; font-size: 14px; font-weight: 600; margin-top: 18px; }
  .preview { position: sticky; top: -22px; z-index: 3; background: #fff; padding: 10px 0; border-bottom: 1px solid var(--borde); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13px; }
  .quick { background: #FAFCF9; border: 1px dashed var(--borde-2); border-radius: 12px; padding: 10px 12px; margin-top: 12px; }
  .quick input { font-family: ui-monospace, Menlo, Consolas, monospace; letter-spacing: 2px; }

  /* ---------- análisis ---------- */
  .barra { display: flex; height: 22px; border-radius: 7px; overflow: hidden; background: #EEF1ED; min-width: 160px; }
  .barra span { display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: var(--tinta); white-space: nowrap; overflow: hidden; }
  .barra .b0 { background: var(--verde); } .barra .b1 { background: #F4C95D; } .barra .b2 { background: var(--rosa); color: #fff; }
  .leyenda { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--tinta-2); margin: 6px 0; }
  .leyenda i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
  .tile { border: 1px solid var(--borde); border-radius: 12px; padding: 14px; }
  .tile h3 { margin-top: 0; }
  .delta-baja { color: var(--verde-osc); font-weight: 700; } .delta-sube { color: var(--rosa-osc); font-weight: 700; }

  .qr-box { display: inline-block; padding: 10px; background: #fff; border: 1px solid var(--borde); border-radius: 12px; }
  .enlace-url { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; word-break: break-all; background: #FAFCF9; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--borde); }

  @media (max-width: 640px) {
    header.topbar { padding: 8px 14px; }
    .brand img { height: 36px; }
    .brand .tag { display: none; }
    .card { padding: 16px 14px; }
    h1 { font-size: 22px; }
    .q-grid td.opt { width: 44px; }
    .q-grid th span.full { display: none; }
  }
  @media (min-width: 641px) { .q-grid th span.corto { display: none; } }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================================================
 * CONFIGURACIÓN — pega aquí la URL /exec de tu implementación de
 * Apps Script (Implementar → Administrar implementaciones).
 * ============================================================ */
var WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbyHjF9RELscnrfLD8kXOeAlMNsjtLyckhT3tmE7GCj8FKGG-83lSeDprrN9Yj505Ko1/exec';

var ESTADOS_MX = ['Aguascalientes','Baja California','Baja California Sur','Campeche','Chiapas','Chihuahua','Ciudad de México','Coahuila','Colima','Durango','Estado de México','Guanajuato','Guerrero','Hidalgo','Jalisco','Michoacán','Morelos','Nayarit','Nuevo León','Oaxaca','Puebla','Querétaro','Quintana Roo','San Luis Potosí','Sinaloa','Sonora','Tabasco','Tamaulipas','Tlaxcala','Veracruz','Yucatán','Zacatecas'];
var ESTATUS_PROYECTO = ['Activo', 'Pausado', 'Cerrado'];
var TIPOS_VISITA = ['Visita domiciliaria', 'Entrevista en escuela', 'Llamada telefónica', 'Taller con familias', 'Otro'];
var RELACIONES = ['Madre', 'Padre', 'Hermano o hermana', 'Abuelo o abuela', 'Tío o tía', 'Otro tutor'];
var ESTATUS_ALERTA = ['Pendiente', 'En seguimiento', 'Canalizada', 'Atendida'];

var root = document.getElementById('app');
var session = null;
try { session = JSON.parse(localStorage.getItem('monstritos_session') || 'null'); } catch (e) { session = null; }
var state = { view: 'proyectos', proyectos: [], proy: null, datos: null, sub: 'participantes', momentoAnalisis: 'Base', alertas: [], filtroAlertas: 'abiertas' };

/* ======================= UTILIDADES ======================= */
function esc(s) { return String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function $(id) { return document.getElementById(id); }
function el(html) { var d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstElementChild; }
function hoy() { var d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); }
function pct(n, d) { return d ? Math.round(n * 1000 / d) / 10 : 0; }
function fmt1(n) { return n === null || n === undefined || isNaN(n) ? '—' : (Math.round(n * 10) / 10).toString(); }
function claseBanda(b) { return { 'Normal': 'normal', 'Límite': 'limite', 'Anormal': 'anormal', 'BAJO': 'bajo', 'MEDIO': 'medio', 'ALTO': 'alto' }[b] || 'gris'; }
function chipBanda(b, txt) { return b ? '<span class="chip ' + claseBanda(b) + '">' + esc(txt !== undefined ? txt : b) + '</span>' : '<span class="chip gris">—</span>'; }
function cmpFolio(a, b) { return String(a).localeCompare(String(b), 'es', { numeric: true }); }

async function sha256(str) {
  var buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(function (b) { return b.toString(16).padStart(2, '0'); }).join('');
}

async function llamar(action, params) {
  if (WEB_APP_URL.indexOf('http') !== 0) return { ok: false, error: 'Falta configurar WEB_APP_URL en index.html (la URL /exec de Apps Script).' };
  var body = Object.assign({ action: action }, params || {});
  try {
    var r = await fetch(WEB_APP_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
    return await r.json();
  } catch (e) {
    return { ok: false, error: 'No se pudo conectar con la plataforma. Revisa tu conexión a internet e intenta de nuevo.' };
  }
}
async function api(action, params) {
  params = params || {}; params.token = session ? session.token : '';
  var r = await llamar(action, params);
  if (!r.ok && r.error && /sesión inválida|expirada/i.test(r.error)) { cerrarSesion(); render(); }
  return r;
}
function guardarSesion(d) { session = { token: d.token, email: d.email, nombre: d.nombre, rol: d.rol }; try { localStorage.setItem('monstritos_session', JSON.stringify(session)); } catch (e) { } }
function cerrarSesion() { session = null; try { localStorage.removeItem('monstritos_session'); } catch (e) { } state.view = 'proyectos'; state.proy = null; state.datos = null; state.prosp = null; }
function esAdmin() { return session && session.rol === 'Administrador'; }

function conSpinner(btn, texto) { var prev = btn.innerHTML; btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> ' + (texto || 'Guardando…'); return function () { btn.disabled = false; btn.innerHTML = prev; }; }
function abrirModal(html) { var m = el('<div class="modal-bg">' + html + '</div>'); document.body.appendChild(m); m.addEventListener('mousedown', function (e) { if (e.target === m) m.dataset.down = '1'; }); return m; }
function toast(txt, tipo) {
  var t = el('<div class="msg ' + (tipo || 'ok') + '" style="position:fixed;right:16px;bottom:16px;z-index:99;max-width:340px;box-shadow:0 6px 24px rgba(0,0,0,.12)">' + esc(txt) + '</div>');
  document.body.appendChild(t); setTimeout(function () { t.remove(); }, 3200);
}

/* ======================= RENDER RAÍZ ======================= */
function render() { if (!session) renderLogin(); else renderApp(); }

function renderLogin() {
  root.innerHTML =
    '<div class="login-wrap"><div class="login-card">' +
      '<img src="logo.png" alt="Monstritos A.C.">' +
      '<p class="sub">Plataforma de seguimiento · acceso para el equipo</p>' +
      '<label for="lEmail">Correo</label><input type="email" id="lEmail" autocomplete="username" placeholder="tu@correo.com">' +
      '<label for="lPass">Contraseña</label><input type="password" id="lPass" autocomplete="current-password" placeholder="••••••••">' +
      '<button class="btn primary" id="btnLogin" style="width:100%;justify-content:center;margin-top:18px;padding:12px">Entrar</button>' +
      '<div id="lMsg"></div>' +
    '</div></div>';
  var go = async function () {
    var email = $('lEmail').value.trim(), pass = $('lPass').value;
    if (!email || !pass) { $('lMsg').innerHTML = '<div class="msg error">Escribe tu correo y contraseña.</div>'; return; }
    var fin = conSpinner($('btnLogin'), 'Entrando…');
    var r = await llamar('login', { email: email, passHash: await sha256(pass) });
    fin();
    if (!r.ok) { $('lMsg').innerHTML = '<div class="msg error">' + esc(r.error) + '</div>'; return; }
    guardarSesion(r); render();
  };
  $('btnLogin').onclick = go;
  ['lEmail', 'lPass'].forEach(function (id) { $(id).addEventListener('keydown', function (e) { if (e.key === 'Enter') go(); }); });
}

function renderApp() {
  var pend = state.alertas.filter(function (a) { return a.estatus !== 'Atendida'; }).length;
  var tabs = [['proyectos', 'Grupos y proyectos'], ['alertas', 'Alertas' + (pend ? '<span class="count">' + pend + '</span>' : '')], ['prospeccion', 'Prospección'], ['instrumentos', 'Instrumentos']];
  if (esAdmin()) tabs.push(['usuarios', 'Usuarios']);
  tabs.push(['cuenta', 'Mi cuenta']);
  root.innerHTML =
    '<header class="topbar">' +
      '<a class="brand" href="#" id="brandHome"><img src="logo.png" alt="Monstritos A.C."><span class="tag">Plataforma de<br>seguimiento</span></a>' +
      '<div class="userbox"><span>' + esc(session.nombre) + '</span><span class="chip ' + (esAdmin() ? 'admin' : 'operativo') + '">' + esc(session.rol) + '</span>' +

function renderMain() {

  }).join('');
  box.innerHTML =

    '<div class="toolbar" style="margin:0"><button class="btn sec" id="btnPlantilla">Plantilla Excel</button><button class="btn sec" id="btnImportar">Importar lista</button><button class="btn verde" id="btnNuevoPart">+ Agregar</button></div></div>' +
    '<input type="file" id="fileImport" accept=".xlsx,.xls,.csv" class="hidden">' +

async function eliminarCuestionario(accion, clave) {
  var k = clave.split('|');
  if (!confirm('¿Eliminar el cuestionario del folio ' + k[0] + ' (momento ' + k[1] + ')? No se puede deshacer.')) return;
  var r = await api(accion, { proyecto: state.proy, folio: k[0], momento: k[1] });
  if (!r.ok) { alert(r.error); return; }
  await recargarProyecto();
}

/* ======================= VALIDACIÓN ======================= */
function validar(inst) {
  var d = state.datos, errores = [], avisos = [];
  if (inst === 'sdq' || inst === 'eri') {
    var lista = filtrarMomento(d[inst]);
    if (!lista.length) errores.push('No hay cuestionarios capturados' + (state.fMomento ? ' en momento ' + state.fMomento : '') + ' para generar el descargable.');
    lista.forEach(function (x) {
      if (x.cal.faltantes.length) avisos.push('Folio ' + x.folio + ' (' + x.momento + '): ' + x.cal.faltantes.length + ' respuesta(s) sin contestar — ítems ' + x.cal.faltantes.join(', ') + '.');
      if (!x.edad || !x.sexo) avisos.push('Folio ' + x.folio + ' (' + x.momento + '): falta edad o sexo.');
      if (inst === 'sdq') {
        ['EMO', 'CON', 'HIP', 'COM', 'PRO'].forEach(function (k) { if (x.cal.escalas[k] === null) avisos.push('Folio ' + x.folio + ': la escala ' + MONS.SDQ_ESCALAS.filter(function (e) { return e.clave === k; })[0].nombre + ' quedó incompleta (3 o más ítems sin respuesta) y no se puntúa.'); });
      } else {
        var r = x.respuestas;
        if (r['19'] === 'a' && r['20'] && r['20'] !== 'a') avisos.push('Folio ' + x.folio + ': en la 19 dice que no ha tenido relaciones pero en la 20 marcó un método. Revisa el papel.');
        MONS.ERI_ITEMS.forEach(function (it) { (it.abiertas || []).forEach(function (a) { if (String(r[it.n] || '').split(',').some(function (v) { return a.si.indexOf(v) > -1; }) && !r[a.clave]) avisos.push('Folio ' + x.folio + ': pregunta ' + it.n + ' sin "' + a.t + '".'); }); });
      }
    });
    var enLista = d.participantes.map(function (p) { return p.folio; });
    var momentos = state.fMomento ? [state.fMomento] : ['Base'];
    momentos.forEach(function (m) {
      var sin = enLista.filter(function (f) { return !d[inst].some(function (x) { return x.folio === f && x.momento === m; }); });
      if (sin.length && d[inst].some(function (x) { return x.momento === m; })) avisos.push(sin.length + ' folio(s) de la lista sin ' + inst.toUpperCase() + ' ' + m + ': ' + sin.slice(0, 15).join(', ') + (sin.length > 15 ? '…' : '') + '.');
    });
  }
  return { errores: errores, avisos: avisos };
}
function mostrarValidacion(inst) {
  var v = validar(inst), box = $('valBox');
  if (!v.errores.length && !v.avisos.length) { box.innerHTML = '<div class="msg ok">Todo en orden: no hay errores ni advertencias.</div>'; return; }
  box.innerHTML = (v.errores.length ? '<div class="msg error"><strong>Hay que corregir antes de descargar:</strong><ul>' + v.errores.map(function (e) { return '<li>' + esc(e) + '</li>'; }).join('') + '</ul></div>' : '') +
    (v.avisos.length ? '<div class="msg warn"><strong>Advertencias (puedes descargar de todos modos):</strong><ul>' + v.avisos.slice(0, 30).map(function (e) { return '<li>' + esc(e) + '</li>'; }).join('') + (v.avisos.length > 30 ? '<li>… y ' + (v.avisos.length - 30) + ' más</li>' : '') + '</ul></div>' : '');
}

/* ======================= ANÁLISIS (cálculos) ======================= */
function analizarSDQ(lista) {
  var n = lista.length;
  var items = MONS.SDQ_ITEMS.map(function (it) {
    var c = [0, 0, 0], suma = 0, resp = 0;

  aoa.push(['RIESGO GLOBAL:', '', '', '', a.glob.BAJO, pct(a.glob.BAJO, a.n) / 100, a.glob.MEDIO, pct(a.glob.MEDIO, a.n) / 100, a.glob.ALTO, pct(a.glob.ALTO, a.n) / 100, 'N/A', 'N/A']);
  return aoa;
}
function hojaEvRiesgo() {
  var aoa = [['Folio', 'ERI base', 'ERI final', 'Cambio %', 'Riesgo global base', 'Riesgo global final', 'SDQ dificultades base', 'SDQ dificultades final', 'Cambio %', 'SDQ prosocial base', 'SDQ prosocial final']];

}

function descargar(inst, formato) {
  var d = state.datos, lista = filtrarMomento(d[inst]).slice().sort(function (a, b) { return cmpFolio(a.folio, b.folio); });
  if (formato === 'pdf') { informePDF(state.fMomento || 'Base', inst); return; }
  if (inst === 'sdq') {
    var t = tablasSDQ(lista);
    if (formato === 'csv') { descargarCSV(t.punt.map(function (r, i) { return i === 0 ? r : r; }), nombreArchivo('SDQ_puntuacion', 'csv')); return; }
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, hojaDeAOA(t.datos, [10, 9, 6, 8, 12, 18].concat(MONS.SDQ_ITEMS.map(function () { return 16; }))), 'Ingresar Datos');
    XLSX.utils.book_append_sheet(wb, hojaDeAOA(t.punt, [10, 9, 6, 8, 12].concat(MONS.SDQ_ITEMS.map(function () { return 5; }))), 'Puntuacion');
    var wsA = hojaDeAOA(hojaAnalisisSDQ(lista), [30, 60, 26, 12, 8, 12, 8, 12, 8, 12, 10]); formatoPct(wsA, [4, 6, 8]);
    XLSX.utils.book_append_sheet(wb, wsA, 'Analisis');
    XLSX.writeFile(wb, nombreArchivo('SDQ', 'xlsx'));
  } else if (inst === 'eri') {
    var e = tablasERI(lista);
    if (formato === 'csv') { descargarCSV(e.punt, nombreArchivo('ERI_puntuacion', 'csv')); return; }
    var wb2 = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb2, hojaDeAOA(e.datos, [10, 9, 6, 8, 12, 18]), 'Ingresar Datos');
    XLSX.utils.book_append_sheet(wb2, hojaDeAOA(e.punt, [10, 9, 6, 8, 12]), 'Puntuacion');
    var wsR = hojaDeAOA(hojaAnalisisERI(lista), [22, 60, 36, 34, 10, 8, 10, 8, 10, 8, 12, 10]); formatoPct(wsR, [5, 7, 9]);
    XLSX.utils.book_append_sheet(wb2, wsR, 'Analisis riesgo');
    var wsE = hojaDeAOA(hojaEvRiesgo(), [10, 10, 10, 10, 16, 16, 18, 18, 10, 16, 16]); formatoPct(wsE, [3, 8]);
    XLSX.utils.book_append_sheet(wb2, wsE, 'Ev. Riesgo');
    XLSX.writeFile(wb2, nombreArchivo('ERI', 'xlsx'));
  }
}
function exportarFamilias() {
  var aoa = [['Folio', 'F1: Nombre(s) y apellidos', 'Relación', 'F2: Nombre(s) y apellidos', 'Relación', 'F3: Nombre(s) y apellidos', 'Relación', 'Dirección', 'Teléfono de contacto', 'Observaciones']];
  state.datos.familias.slice().sort(function (a, b) { return cmpFolio(a.folio, b.folio); }).forEach(function (f) { aoa.push([f.folio, f.f1_nombre, f.f1_relacion, f.f2_nombre, f.f2_relacion, f.f3_nombre, f.f3_relacion, f.direccion, f.telefono, f.observaciones]); });

function exportarVisitas() {
  var v = state.datos.visitas.slice().sort(function (a, b) { return String(a.fecha).localeCompare(String(b.fecha)); });
  var reg = [['Fecha', 'Folio', 'Tipo', 'Responsable', 'Asistentes', 'Observaciones']].concat(v.map(function (x) { return [x.fecha, x.folio, x.tipo, x.responsable, x.asistentes, x.observaciones]; }));
  var meses = {}; v.forEach(function (x) { if (x.fecha) meses[String(x.fecha).slice(0, 7)] = 1; }); var ms = Object.keys(meses).sort();
  var fol = {}; v.forEach(function (x) { fol[x.folio] = 1; });
  var res = [['Folio'].concat(ms).concat(['Total'])].concat(Object.keys(fol).sort(cmpFolio).map(function (f) { var t = 0; var row = [f].concat(ms.map(function (m) { var n = v.filter(function (x) { return x.folio === f && String(x.fecha).slice(0, 7) === m; }).length; t += n; return n; })); return row.concat([t]); }));
  var wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, hojaDeAOA(reg, [12, 10, 22, 22, 24, 50]), 'Registro de visitas'); XLSX.utils.book_append_sheet(wb, hojaDeAOA(res), 'Visitas Fam'); XLSX.writeFile(wb, nombreArchivo('Visitas_familiares', 'xlsx'));
}

function informePDF(momento, soloInst) {
  var d = state.datos, p = d.proyecto;
  var sdq = d.sdq.filter(function (x) { return x.momento === momento; }), eri = d.eri.filter(function (x) { return x.momento === momento; });
  var aS = analizarSDQ(sdq), aE = analizarERI(eri);
  var bar = function (c, t) { if (!t) return ''; return '<div class="barra">' + c.map(function (v, i) { return '<span class="b' + i + '" style="width:' + pct(v, t) + '%"></span>'; }).join('') + '</div>'; };
  var html = encabezadoPrint('Informe de grupo · ' + momento, esc(p.escuela) + (p.grupo ? ' · ' + esc(p.grupo) : '') + (p.ciclo ? ' · Ciclo ' + esc(p.ciclo) : '') + '<br>' + esc(p.codigo) + ' · generado el ' + hoy());
  html += '<div class="kpis"><div class="kpi"><b>' + d.participantes.length + '</b>niñas y niños en la lista</div><div class="kpi"><b>' + aS.n + '</b>SDQ (' + momento + ')</div><div class="kpi"><b>' + aE.n + '</b>ERI (' + momento + ')</div><div class="kpi"><b>' + aE.alertas + '</b>con alerta de autolesión</div></div>';
  if (soloInst !== 'eri') {
    html += '<h3>SDQ · Capacidades y dificultades</h3>' + (aS.n ? '<table><thead><tr><th>Escala</th><th>Distribución</th><th class="num">Normal</th><th class="num">Límite</th><th class="num">Anormal</th><th class="num">Promedio</th></tr></thead><tbody>' +
      aS.escalas.map(function (s) { var c = [s.b['Normal'], s.b['Límite'], s.b['Anormal']]; return '<tr><td>' + esc(s.e.nombre) + '</td><td>' + bar(c, s.n) + '</td><td class="num">' + c[0] + ' (' + pct(c[0], s.n) + '%)</td><td class="num">' + c[1] + ' (' + pct(c[1], s.n) + '%)</td><td class="num">' + c[2] + ' (' + pct(c[2], s.n) + '%)</td><td class="num">' + fmt1(s.prom) + '</td></tr>'; }).join('') + '</tbody></table>' : '<p>Sin datos.</p>');
  }
  if (soloInst !== 'sdq') {
    html += '<h3>ERI · Evaluación de riesgo</h3>' + (aE.n ? '<table><thead><tr><th></th><th class="num">Bajo</th><th class="num">Medio</th><th class="num">Alto</th></tr></thead><tbody>' +
      '<tr><td>Puntuación total (promedio ' + fmt1(aE.prom) + ')</td><td class="num">' + aE.tot.BAJO + ' (' + pct(aE.tot.BAJO, aE.n) + '%)</td><td class="num">' + aE.tot.MEDIO + ' (' + pct(aE.tot.MEDIO, aE.n) + '%)</td><td class="num">' + aE.tot.ALTO + ' (' + pct(aE.tot.ALTO, aE.n) + '%)</td></tr>' +
      '<tr><td><b>Riesgo global</b></td><td class="num">' + aE.glob.BAJO + ' (' + pct(aE.glob.BAJO, aE.n) + '%)</td><td class="num">' + aE.glob.MEDIO + ' (' + pct(aE.glob.MEDIO, aE.n) + '%)</td><td class="num">' + aE.glob.ALTO + ' (' + pct(aE.glob.ALTO, aE.n) + '%)</td></tr></tbody></table>' +
      '<table><thead><tr><th>Pregunta · factor</th><th>Distribución</th><th class="num">0</th><th class="num">1</th><th class="num">2</th><th class="num">Prom.</th></tr></thead><tbody>' +
      aE.cats.map(function (cat) { return '<tr><th colspan="6">' + esc(cat.cat.nombre) + '</th></tr>' + cat.items.map(function (i) { return '<tr><td>' + i.it.n + '. ' + esc(i.it.factor) + '</td><td>' + bar(i.c, i.resp) + '</td><td class="num">' + i.c[0] + '</td><td class="num">' + i.c[1] + '</td><td class="num">' + i.c[2] + '</td><td class="num">' + fmt1(i.prom) + '</td></tr>'; }).join(''); }).join('') +
      '</tbody></table>' : '<p>Sin datos.</p>');
    var comp = comparativo().filter(function (c) { return c.eriB !== null && c.eriF !== null; });
    if (comp.length) {
      html += '<h3>Comparativo base → final (ERI)</h3><table><thead><tr><th>Folio</th><th class="num">Base</th><th class="num">Final</th><th class="num">Cambio</th><th>Riesgo global</th></tr></thead><tbody>' +
        comp.map(function (c) { return '<tr><td>' + esc(c.folio) + '</td><td class="num">' + c.eriB + '</td><td class="num">' + c.eriF + '</td><td class="num">' + (c.eriCambio === null ? '—' : (Math.round(c.eriCambio * 1000) / 10) + '%') + '</td><td><span class="chip ' + claseBanda(c.globB) + '">' + esc(c.globB) + '</span> → <span class="chip ' + claseBanda(c.globF) + '">' + esc(c.globF) + '</span></td></tr>'; }).join('') + '</tbody></table>';

  ventanaImpresion('Informe ' + p.escuela + ' ' + momento, html);
}
